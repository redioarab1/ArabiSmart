# ─── إعادة توجيه HTTP → HTTPS ─────────────────────────────────────────────────
server {
    listen 80;
    server_name arabismart.vip www.arabismart.vip;

    # للسماح لـ Certbot بتجديد SSL
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # إعادة توجيه كل شيء لـ HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── HTTPS الرئيسي ────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name arabismart.vip www.arabismart.vip;

    # شهادة SSL (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/arabismart.vip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/arabismart.vip/privkey.pem;

    # إعدادات SSL الآمنة
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # حماية أمنية
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # حجم رفع الملفات
    client_max_body_size 50M;

    # ─── ملفات MinIO (الصور والملفات) ─────────────────────────────────────────
    location /files/ {
        proxy_pass http://minio:9000/arabismart/;
        proxy_set_header Host minio:9000;
        proxy_set_header X-Real-IP $remote_addr;

        # Cache للملفات الثابتة
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ─── Service Worker (لـ PWA) ───────────────────────────────────────────────
    location /sw.js {
        proxy_pass http://backend:3000;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
    }

    location /manifest.json {
        proxy_pass http://backend:3000;
        add_header Cache-Control "no-cache";
    }

    # ─── API والـ Backend ──────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # ─── كل شيء آخر → Backend (SPA) ──────────────────────────────────────────
    location / {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Gzip
        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    }
}
