version: '3.8'

services:
  # ─── قاعدة البيانات MySQL ──────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: arabismart
      MYSQL_USER: ${MYSQL_USER:-arabismart_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backup.sql:/docker-entrypoint-initdb.d/backup.sql:ro
    ports:
      - "127.0.0.1:3306:3306"   # محلي فقط - لا يُكشف للخارج
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── تخزين الملفات MinIO ──────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:9000:9000"   # S3 API - محلي فقط
      - "127.0.0.1:9001:9001"   # MinIO Console - محلي فقط
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ─── إنشاء bucket تلقائياً ────────────────────────────────────────────────
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 ${S3_ACCESS_KEY:-minioadmin} ${S3_SECRET_KEY} &&
      mc mb --ignore-existing myminio/arabismart &&
      mc anonymous set public myminio/arabismart &&
      echo 'MinIO bucket ready'
      "
    restart: "no"

  # ─── الـ Backend (Node.js + Express) ──────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"   # محلي فقط - Nginx يتولى الوصول الخارجي
    environment:
      NODE_ENV: production
      TZ: Europe/Stockholm
      # قاعدة البيانات
      DATABASE_URL: mysql://${MYSQL_USER:-arabismart_user}:${MYSQL_PASSWORD}@mysql:3306/arabismart
      # المصادقة
      JWT_SECRET: ${JWT_SECRET}
      # تخزين الملفات MinIO
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: arabismart
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_PUBLIC_URL: https://arabismart.vip/files
      S3_REGION: us-east-1
      # الذكاء الاصطناعي
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      # الموقع
      FRONTEND_URL: https://arabismart.vip
      SITE_URL: https://arabismart.vip
      # البريد الإلكتروني
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      # Google Analytics
      VITE_GA_MEASUREMENT_ID: G-Q9N7SX7GD5
      # النشر الاجتماعي (اختياري)
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHANNEL_ID: ${TELEGRAM_CHANNEL_ID:-}
      FACEBOOK_PAGE_TOKEN: ${FACEBOOK_PAGE_TOKEN:-}
      FACEBOOK_PAGE_ID: ${FACEBOOK_PAGE_ID:-}
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./fonts:/app/fonts:ro   # خطوط عربية للـ PDF

  # ─── Nginx (Reverse Proxy + SSL) ──────────────────────────────────────────
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro
    depends_on:
      - backend

  # ─── Certbot (تجديد SSL تلقائي) ───────────────────────────────────────────
  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done'"

volumes:
  mysql_data:
  minio_data:
  certbot_www:
  certbot_conf:
